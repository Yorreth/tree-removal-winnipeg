<header class="site-header" id="header">
  <div class="container header-inner">
    <a class="logo" href="/">
      <svg viewBox="0 0 24 24" aria-hidden="true">{{ site.logo_icon_svg }}</svg>
      <span>{{ site.business_name_html }}</span>
    </a>

    <nav class="main-nav" id="main-nav" aria-label="Primary">
      <a href="/#services">Services</a>
      <a href="/#how-it-works">How It Works</a>
      <a href="/#faq">FAQ</a>
      <a href="/blog/">Blog</a>
    </nav>

    <div class="header-actions">
      <a class="phone-link" data-phone-link href="tel:{{ site.phone_tel }}">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.362 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.338 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        <span data-phone-display>{{ site.phone_display }}</span>
      </a>
      <a class="btn btn-primary btn-sm" href="/#quote">Get Free Quote</a>
      <button class="nav-toggle" id="navToggle" aria-label="Toggle menu" aria-expanded="false" aria-controls="main-nav">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</header>
